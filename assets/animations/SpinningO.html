<!--assets/animations/SpinningO.html-->
<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OrideDax — Loader</title>

  <style>
    /* =====================================================
       CLEAN LOADER — PRODUCTION READY (Transparent)
       Cross-browser optimized (Safari, iOS, etc.)
    ===================================================== */
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      background: transparent; /* ✅ no background */
    }

    /* --- Spinning OrideDax Wheel --- */
    .spinning-wheel {
      width: 120px;
      height: 120px;
      animation: spin 3.6s cubic-bezier(0.42, 0, 0.58, 1) infinite;
      filter: drop-shadow(0 0 8px rgba(255,111,0,0.4));
      
      /* ✅ Cross-browser user select disable */
      -webkit-user-select: none;
      -ms-user-select: none;
      -moz-user-select: none;
      user-select: none;

      /* ✅ No pointer interaction */
      pointer-events: none;
    }

    @keyframes spin {
      0%   { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* Optional smooth entry fade */
    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.96); }
      to   { opacity: 1; transform: scale(1); }
    }

    .spinning-wheel {
      animation-name: spin, fadeIn;
      animation-duration: 3.6s, 0.8s;
      animation-timing-function: cubic-bezier(0.42, 0, 0.58, 1), ease;
      animation-iteration-count: infinite, 1;
    }
  </style>
</head>

<body>
  <!-- ✅ Transparent spinning O logo -->
  <img src="../icons/O.png" alt="OrideDax O logo" class="spinning-wheel" />
</body>
</html>
